workflows:
  android-apk:
    name: Build Native Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Generate Gradle Wrapper & Build APK
        script: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk

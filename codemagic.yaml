workflows:
  android-apk:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      java: 17
      node: 20
    scripts:
      - name: Clean npm and Install dependencies
        script: |
          rm -rf node_modules package-lock.json android
          npm install --include=optional
          npm rebuild
      - name: Build Web App
        script: npm run build
      - name: Add Android platform clean
        script: |
          npx cap init "Deutsch Lernen" "com.deutsch.app" --web-dir dist
          npx cap add android
          npx cap sync
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
